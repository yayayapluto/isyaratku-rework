## Out of scope

- Model accuracy on new signers. `data/self/` is empty; that is a recording problem.
- New glosses, letters, digits, or words.
- Any change to runtime recognition behaviour in `src/core/` or `src/adapters/`
  beyond what C1 cleanup requires.
- Distributing the dataset. `data/` is git-ignored and stays that way.
- Improving `data/raw/wl-bisindo.zip` handling beyond making the workflow
  reproducible (the zip is 2.13 GB and already present).

## Constraints

- **Indonesian prose, English identifiers** (docs/AGENTS.md). All new docs in
  Bahasa Indonesia; code, paths, and library names in English.
- **No fabricated numbers** (docs/AGENTS.md "Kebenaran data"). Every count must
  come from a command run in this repo. Unverified = "belum diperiksa".
- **`data/` never enters git.**
- **Don't edit files under `data/raw/`.** Training reads them only.
- **Dependency direction:** `ui -> core <- adapters`. `src/core/` must not import
  UI, adapter, camera, or GUI libraries.
- **No virtualenv on this machine**; packages live on the global interpreter.
- **Slices, not schedules:** each story ends with a run that shows its result.

## Open questions for the user

1. Should `data/raw/wl-bisindo/` be completed to 1600 files (extract the 445 from
   the zip / move them from `pilih75`), or should the documented extraction
   command be changed to read both directories? Completing the dir is the smaller,
   more honest fix; changing the command hides the layout problem.
2. Is the committed model set expected to be re-trained during this initiative, or
   are the existing `models/*.npz` frozen deliverables? Re-training would let A1's
   fix be proven against a real run; freezing means A1 is proven by npz-count only.
