# SCOPE — Cleanliness, Reliability, Ease-of-Use (training-data centred)

Latest. Phase 1 DISCOVER, 2026-10-16.

## In scope

### A. Training data reproducibility (highest priority)

| ID | Item | Current evidence |
| --- | --- | --- |
| A1 | Reconcile `data/raw/` layout with the documented extraction command | `training/extract.py:49` `DEFAULT_SOURCE_DIR = data/raw/wl-bisindo`. On disk that dir holds 1155 of 1600 mp4; the other 445 sit in `data/raw/pilih75/`. Re-running the documented command on this layout yields 1155 npz, not the 1600 the models were trained on. |
| A2 | Make one command reproduce `data/extracted/` from `data/raw/` | Two source dirs must be walked today (`wl-bisindo` + `pilih75`), and only by someone who knows the split. |
| A3 | Reconcile `data/raw/wl-bisindo.zip` (1600 entries) against the extracted dir (1155 files) | Verified: zip 1600, wl dir 1155, pilih75 446, overlap of missing 445, unaccounted 0. |
| A4 | Document the demo dataset separately from the real dataset | `data/extracted/demo3/` holds 200 synthetic `signer99_*` npz mixed into the same tree as the 1600 real npz. `training/dataset.py` globs `*.npz` at root only, so demo3 is invisible to it — but nothing states that invariant in docs, and a future `rglob` would silently poison the split. |

