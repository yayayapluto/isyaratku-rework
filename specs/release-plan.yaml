## e01 — Dataset raw layout + reproducible extraction

**Objective:** the documented extraction command produces the dataset the models
were trained on.

- [ ] e01s01 — Snapshot `data/extracted/` counts and the raw inventory into
  `specs/evidence/` before touching anything. `verify:` the snapshot file names
  1600 npz, 1155 wl mp4, 446 pilih75 mp4.
- [ ] e01s02 — Extract the 445 missing videos from `data/raw/wl-bisindo.zip` into
  `data/raw/wl-bisindo/`. `verify:` `python -c "import pathlib;print(len(list(pathlib.Path('data/raw/wl-bisindo').glob('*.mp4'))))"` prints 1600.
- [ ] e01s03 — Confirm extraction of the completed directory is a no-op and the npz
  set is unchanged. `verify:` `python -m training.extract` reports 1600 skipped,
  0 processed; `python -m training.dataset` still reports 1600 npz.
- [ ] e01s04 — Record the raw-layout fact in `docs/dataset-notes.md` in Bahasa
  Indonesia, including that `pilih75` is a selection, not a source.
  `verify:` the doc states zip=1600, wl=1600, pilih75=446 and cites this plan.

**Closes:** SCOPE A1, A2, A3. **Resolves:** ADR-0001.

## e02 — Retrain and re-measure

**Objective:** models re-trained from the now-reproducible dataset, with numbers
recomputed this session.

- [ ] e02s01 — Snapshot current `models/*.joblib|.npz|.json` to a timestamped dir
  outside git before overwriting. `verify:` snapshot dir contains 21 files.
- [ ] e02s02 — Retrain the word baseline. `verify:` `python -m training.train`
  finishes and writes `models/baseline.joblib|.npz|.json`; the printed split counts
  match `training.dataset`.
- [ ] e02s03 — Retrain the static models per README's documented targets.
  `verify:` `python -m training.train_static --target <each>` finishes and each
  `models/<stem>.json` carries a fresh metric block.
- [ ] e02s04 — Re-measure and record p50/p95 prediction latency and accuracy per
  model into `docs/tech-decisions.md`. `verify:` every number in the new section
  traces to a command run this session; no number copied from a prior entry.
- [ ] e02s05 — Confirm the runtime still loads the fresh artifacts.
  `verify:` `python -m src.ui.app --headless --seconds 3` prints
  `Headless smoke: LOLOS`.

**Closes:** SCOPE B3, and provides the evidence behind A1.

## e03 — Verify path

**Objective:** one command, green, reproducible.

- [ ] e03s01 — Add `pyproject.toml` with `[tool.pytest.ini_options]` (`testpaths`,
  `filterwarnings` for the known sounddevice deprecation) and project metadata.
  `verify:` `python -m pytest -q` collects 313 tests without needing `-p no:cacheprovider`.
- [ ] e03s02 — Add a linter config (ruff) and fix only real findings; leave stylistic
