# Release plan — IsyaratKu cleanliness / reliability / ease-of-use

Version target: **v0.9.0-data-reproducible** (a data-correctness release, not a feature release)
Phase 3 PLAN, 2026-10-16.
Baseline: 313 tests passing, 157.54s. Branch `dev`, HEAD `018d266`.

Ordering is WSJF: user/business value ÷ job size, highest first. Every task carries a
`verify:` that produces an observable result.

---

## Epic index

| Epic | Title | WSJF rationale | Trains? | Blocks |
| --- | --- | --- | --- | --- |
| e01 | Dataset raw layout + reproducible extraction | Highest value: it is the one thing the user named ("especially on training data") and currently false. Small job. | no | e03 |
| e02 | Retrain and re-measure, recording honest numbers | User chose it; produces the evidence that e01 is correct end to end. Medium job. | yes | e04 |
| e03 | Verify path: pytest config, lint, single documented command | Low cost, unblocks every later story's verify step. | no | — |
