# Konfigurasi IsyaratKu Cam.
#
# Berkas ini opsional: setiap key punya default, aplikasi jalan tanpa berkas ini.
# Hanya tulis key yang nilainya BERBEDA dari default. Key tak dikenal akan
# memicu peringatan di stderr dan diabaikan. Tipe salah atau nilai tidak valid
# menggagal startup dengan pesan yang menyebut nama key.
#
# Default (kontrak, lihat docs/architecture.md):
#   camera.device_index = 0
#   camera.width = 640, camera.height = 480, camera.fps = 30
#   landmark.max_num_hands = 2, landmark.model_complexity = 0
#   window.frame_count = 30, window.stride = 5
#   smoothing.confidence_threshold = 0.7, smoothing.vote_count = 3,
#   smoothing.cooldown_seconds = 1.5
#   queue.max_size = 4
#   pipeline.stats_window = 240, pipeline.stop_timeout_seconds = 2.0
#   pipeline.stats_window = banyak frame terakhir yang dipakai menghitung FPS
#     (240 default ~4 s pada 60 fps); pipeline.stop_timeout_seconds = batas tunggu
#     join thread saat stop.
#   tts.device_name = "CABLE Output", tts.rate = 160
#   virtual_camera.backend = "unitycapture"
#
# Path alternatif: set environment variable ISYARATKU_CONFIG.
#
# Hasil ukur (mesin ini), dipakai memilih default di kode:
#   Kamera USB2.0 HD UVC WebCam, 640x480, 300 frame.
#     CAP_DSHOW: fps_capture 8.80, capture_ms_p50 110.58 -> di bawah target 25-30 FPS.
#     CAP_MSMF : fps_capture 28.56, capture_ms_p50 ~2.0 -> memenuhi target.
#     CAP_ANY  : fps_capture 28.57 (MSMF terpilih).
#   Karena itu src/adapters/camera.py memakai CAMERA_BACKEND = cv2.CAP_MSMF.
#
#   Jalur headless dengan FakeVirtualCameraSink (tanpa time.sleep, tanpa
#   hardware): FPS terkirim 1655.60, 5023 frame dibaca / 4966 dikirim / 57
#   dibuang dalam 3.00 s. Angka itu lingkungan beban CPU, BUKAN patokan kamera.
#
# Konstanta fake (bukan kontrak, hanya fixture test/headless): FakeCameraSource
# speed = 4.0 piksel/frame, sisi kotak 40 px, posisi y = 0.6 tinggi frame.
# Diganti nyata oleh ekstraksi landmark slice 2 dan model slice 4; fake tanpa
# time.sleep supaya angka FPS headless mencerminkan beban CPU apa adanya.
#
# Contoh menimpa satu nilai:
# [camera]
# device_index = 1

